{% extends "base.html" %}
{% block title %}Asset label · {{ a.asset_id }}{% endblock %}
{% block content %}
<section class="asset-label">
  <img src="{{ url_for('logo') }}" alt="TGM Assets" class="asset-label-logo">
  <img src="{{ url_for('asset_qr', asset_id=a.asset_id) }}" alt="QR code for {{ a.asset_id }}" class="asset-label-qr">
  <h1>{{ a.name }}</h1>
  <p>{{ a.asset_id }} · {{ a.category }}</p>
  <p>{{ a.location or 'Location not set' }}</p>
  <button type="button" class="print-label">Print label</button>
  <a class="btn btn-gray" href="{{ url_for('asset_detail', asset_id=a.asset_id) }}">Back to asset</a>
</section>
{% endblock %}
