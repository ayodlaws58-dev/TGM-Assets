{% extends "base.html" %}{% from "_macros.html" import header, csrf %}
{% block title %}Edit asset{% endblock %}
{% block content %}
{{ header('Edit ' ~ a.name, a.asset_id) }}
<form method="post" class="card form-grid">{{ csrf() }}
<div><label>Name</label><input name="name" value="{{ a.name }}" required></div>
<div><label>Category</label><select name="category">{% for c in categories %}<option {{ 'selected' if c == a.category }}>{{ c }}</option>{% endfor %}</select></div>
<div><label>Location</label><input name="location" value="{{ a.location }}"></div>
<div><label>Owner / responsible team</label><input name="owner" value="{{ a.owner }}"></div>
<div><label>Parent asset</label><select name="parent_id"><option value="">None (top-level asset)</option>{% for p in parents %}<option value="{{ p.asset_id }}" {{ 'selected' if p.asset_id == a.parent_id }}>{{ p.asset_id }} · {{ p.name }}</option>{% endfor %}</select></div>
<div><label>Purchase date</label><input name="purchase_date" type="date" value="{{ a.purchase_date }}"></div>
<div><label>Purchase cost</label><input name="cost" type="number" min="0" step="0.01" value="{{ a.cost }}"></div>
<div><label>Lifecycle status</label><select name="status">{% for s in statuses %}<option {{ 'selected' if s == a.status }}>{{ s }}</option>{% endfor %}</select></div>
<div><label>Useful life (years)</label><input name="useful_life_years" type="number" min="1" max="100" value="{{ a.useful_life_years }}"></div>
<div><label>Salvage value</label><input name="salvage_value" type="number" min="0" step="0.01" value="{{ a.salvage_value }}"></div>
<div><label>Interval (days)</label><input name="interval_days" type="number" min="1" value="{{ a.interval_days }}" required></div>
<div><label>Last serviced / painted</label><input name="last_service" type="date" value="{{ a.last_service }}" required></div>
<div><label>Notes</label><input name="notes" value="{{ a.notes }}"></div>
<div><label>Retirement date</label><input name="retired_on" type="date" value="{{ a.retired_on }}"></div>
<div><label>Disposal date</label><input name="disposed_on" type="date" value="{{ a.disposed_on }}"></div>
<div><label>Disposal proceeds</label><input name="disposal_value" type="number" min="0" step="0.01" value="{{ a.disposal_value }}"></div>
<div><label>Disposal notes</label><input name="disposal_note" value="{{ a.disposal_note }}"></div>
<div class="inline"><button>Save</button><a class="btn btn-gray" href="{{ url_for('assets_page') }}">Cancel</a></div>
</form>
<p><a class="btn btn-gray" href="{{ url_for('asset_detail', asset_id=a.asset_id) }}">View asset record</a>
<a class="btn btn-gray" href="{{ url_for('asset_label', asset_id=a.asset_id) }}">Print QR label</a></p>
{% endblock %}
